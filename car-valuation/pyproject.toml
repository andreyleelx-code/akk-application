[project]
name = "carval"
version = "0.1.0"
description = "ИИ-помощник оценщика авто: контроль съёмки, поиск дефектов, расчёт цены, отчёт в Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1,<3",
    "aiogram>=3.31,<4",
    "supabase>=2.33,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6,<7",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
carval-bot = "carval.bot.main:run"
carval-backtest = "carval.backtest:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
