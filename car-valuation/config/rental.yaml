# Условия проката для расчёта при возврате.
# Значения по умолчанию взяты с silkway-carrent.kz/conditions (октябрь 2026),
# цена топлива — пример. Правьте под действующие условия компании.

km_per_day: 200          # лимит пробега в сутки по городу
extra_km_kzt: 50         # цена километра сверх лимита
fuel_kzt_per_l: 260      # АИ-95, пример
deposit_default: 30000   # депозит по городу «от 30 000 ₸»
wash_kzt:                # мойка, если машину вернули грязной
  sedan: 5000
  crossover: 7000
  suv: 8000
# Если ремонт новых повреждений дороже этой суммы — предлагаем страховой случай (КАСКО)
insurance_threshold_kzt: 150000
