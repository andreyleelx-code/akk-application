# Какие дефекты ищет ИИ в каждой зоне. Попадает в промпт дефектоскопа.
# Код дефекта (ключ) используется в прайсе ремонта: config/repair_prices*.csv

body:
  dent: Вмятина
  scratch: Царапина
  chip: Скол ЛКП
  paint_mismatch: Разнотон краски (признак перекраса)
  panel_gap: Неровный зазор между панелями (признак ремонта/ДТП)
  rust: Коррозия
  crack_bumper: Трещина/разрыв бампера

glass_lights:
  glass_chip: Скол стекла
  glass_crack: Трещина стекла
  headlight_haze: Помутнение фары
  light_crack: Трещина фары/фонаря
  light_moisture: Запотевание фары изнутри

wheels:
  tire_wear: Износ протектора
  tire_uneven_wear: Неравномерный износ (развал-схождение)
  rim_damage: Повреждение диска (бордюр, деформация)
  tire_mismatch: Разные шины на одной оси

interior:
  seat_wear: Износ/порыв сиденья
  wheel_wear: Затёртость руля/КПП (несоответствие пробегу)
  dash_warning: Горящие ошибки на приборной панели
  stain: Пятна, прожоги
  trim_damage: Повреждение пластика/обшивки

engine_bay:
  oil_leak: Следы масла/подтёки
  non_factory_weld: Нештатная сварка, следы ремонта лонжеронов
  missing_parts: Отсутствующие детали, кустарная проводка
  coolant_leak: Следы антифриза
