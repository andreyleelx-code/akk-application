<!DOCTYPE html><html lang="ru"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1, viewport-fit=cover, " name="viewport">
<meta content="yes" name="mobile-web-app-capable">
<meta content="yes" name="apple-mobile-web-app-capable">
<meta content="default" name="apple-mobile-web-app-status-bar-style">
<meta content="#0f2a4a" name="theme-color">
<title>Digital AKK</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2a4a;
    --navy-2:#173a5e;
    --coral:#e8623f;
    --coral-dark:#c94f30;
    --gold:#c9972f;
    --sage:#5f8f6a;
    --cream:#faf6f0;
    --paper:#fffdfa;
    --line:#ece3d6;
    --ink:#2a2621;
    --ink-soft:#75695c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans',Arial,sans-serif;
    background:var(--cream);
    color:var(--ink);
  }
  h1,h2,.disp{font-family:'Manrope',sans-serif;}

  /* ---------- demo page chrome ---------- */
  header.demo-header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff; padding:28px 24px; text-align:center;
  }
  header.demo-header h1{margin:0 0 6px;font-size:20px;font-weight:800;}
  header.demo-header p{margin:0;color:#cfe0ee;font-size:13px;}
  .stage{display:flex;justify-content:center;padding:34px 20px 60px;}

  /* ---------- phone frame (from mockups.html, reused as-is) ---------- */
  .phone{
    width:300px;height:640px;background:#111;border-radius:38px;padding:10px;
    box-shadow:0 18px 40px rgba(15,42,74,.18), 0 2px 6px rgba(15,42,74,.10);
    position:relative;
  }
  .screen{
    width:100%;height:100%;background:var(--cream);border-radius:28px;overflow:hidden;
    display:flex;flex-direction:column;position:relative;
  }
  .notch{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:120px;height:22px;background:#111;border-radius:0 0 14px 14px;z-index:5;
  }
  .status{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 4px;font-size:11px;font-weight:700;color:var(--navy);}
  .screen-body{flex:1;overflow:hidden;padding:0 14px 8px;}
  .screen-body.scroll{overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .screen-body.scroll::-webkit-scrollbar{display:none;width:0;height:0;}
  .appbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 8px;}
  .appbar .logo{display:flex;align-items:center;gap:8px;}
  .logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--coral),var(--gold));flex-shrink:0;}
  .appbar .name{font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;color:var(--navy);}
  .icon-btn{width:30px;height:30px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .icon{width:16px;height:16px;stroke:var(--navy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .icon.coral{stroke:var(--coral);}
  .icon.white{stroke:#fff;}

  /* bottom nav */
  .tabbar{
    display:flex;justify-content:space-around;align-items:center;
    background:#fff;border-top:1px solid var(--line);
    padding:9px 6px calc(9px + 8px);
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;width:56px;}
  .tab span{font-size:9.5px;color:var(--ink-soft);font-weight:600;}
  .tab.active span{color:var(--coral);}
  .tab .icon{stroke:var(--ink-soft);}
  .tab.active .icon{stroke:var(--coral);}

  /* cards / chips generic */
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(15,42,74,.05);}
  .chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:10.5px;font-weight:600;color:var(--navy);}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .tag{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--cream);color:var(--navy);}
  .tag.coral{background:#fdece6;color:var(--coral-dark);}
  .tag.gold{background:#faf1de;color:#8a6a1c;}
  .btn{background:var(--coral);color:#fff;font-family:'Manrope',sans-serif;font-weight:700;font-size:11.5px;border:none;border-radius:10px;padding:8px 0;text-align:center;}
  .btn.ghost{background:#fff;color:var(--navy);border:1.4px solid var(--navy);}
  .grad-ph{border-radius:10px;background:linear-gradient(135deg,#e9d9c4,#f4c9a8);}

  /* HOME screen specifics */
  .banner-carousel{margin-bottom:12px;}
  .banner-slide{height:70px;border-radius:14px;background:linear-gradient(135deg,#2a4a6e,#3f7a9e);display:flex;align-items:center;padding:0 14px;color:#fff;position:relative;overflow:hidden;}
  .banner-slide .adbadge{position:absolute;top:7px;right:9px;background:rgba(255,255,255,.22);font-size:7px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:5px;}
  .banner-slide .bt{font-family:'Manrope',sans-serif;font-weight:800;font-size:11.5px;}
  .banner-slide .bs{font-size:8.5px;color:#dbe9f5;margin-top:2px;}
  .banner-dots{display:flex;justify-content:center;gap:4px;margin-top:7px;}
  .banner-dots i{width:5px;height:5px;border-radius:50%;background:var(--line);display:block;}
  .banner-dots i.on{background:var(--coral);width:14px;border-radius:3px;}

  .kpark-card{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);border-radius:16px;padding:14px;color:#fff;margin-bottom:12px;}
  .kpark-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .kpark-card .top .t{font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;}
  .kpark-card .top .s{font-size:10px;color:#c9d8ea;margin-top:2px;}
  .ring{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--coral) 0% 68%, rgba(255,255,255,.18) 68% 100%);display:flex;align-items:center;justify-content:center;}
  .ring .in{width:34px;height:34px;border-radius:50%;background:var(--navy-2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}
  .kpark-card .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.16);margin-top:12px;overflow:hidden;}
  .kpark-card .bar i{display:block;height:100%;width:68%;background:linear-gradient(90deg,var(--coral),var(--gold));}
  .kpark-card .foot{display:flex;justify-content:space-between;font-size:9.5px;color:#dbe6f1;margin-top:8px;}

  .bday-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
  .bday-avatars{display:flex;flex-shrink:0;}
  .bday-avatars i{width:32px;height:32px;border-radius:50%;border:2px solid #fff;margin-left:-10px;background:linear-gradient(135deg,#e9d9c4,#f4c9a8);box-shadow:0 1px 3px rgba(15,42,74,.1);}
  .bday-avatars i:first-child{margin-left:0;}
  .bday-text{flex:1;min-width:0;}
  .bday-text .t{font-size:10.5px;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bday-text .s{font-size:8.5px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bday-btn{background:var(--coral);color:#fff;font-size:8.5px;font-weight:700;border:none;border-radius:8px;padding:7px 8px;white-space:nowrap;flex-shrink:0;}
  .news-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .news-item:last-child{border-bottom:none;}
  .news-item .ph{width:56px;height:56px;flex-shrink:0;}
  .news-item .title{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3;}
  .news-item .meta{font-size:10px;color:var(--ink-soft);margin-top:4px;display:flex;gap:6px;align-items:center;}

  .hero-card{position:relative;height:112px;border-radius:16px;overflow:hidden;margin-bottom:10px;
    background:linear-gradient(135deg,#d8c3a5,#eb9b6f);}
  .hero-card .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,42,74,0) 30%,rgba(15,42,74,.88) 100%);
    display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;}
  .hero-card .htag{align-self:flex-start;background:var(--coral);color:#fff;font-size:8.5px;font-weight:700;padding:3px 8px;border-radius:6px;margin-bottom:6px;}
  .hero-card .hh{color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;line-height:1.25;}
  .hero-card .hm{color:#e8e0d5;font-size:9px;margin-top:4px;}

  .sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 7px;}
  .sec-head .t{font-family:'Manrope',sans-serif;font-weight:800;font-size:10.5px;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;}
  .sec-head .l{font-size:9.5px;color:var(--coral-dark);font-weight:700;}

  .appeal-card{display:flex;align-items:center;gap:10px;background:#fff;border:1.4px dashed var(--navy);border-radius:14px;padding:10px 12px;margin-bottom:4px;}
  .appeal-card .ic{width:32px;height:32px;border-radius:9px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .appeal-card .tx{flex:1;}
  .appeal-card .tx .t{font-size:11px;font-weight:700;color:var(--navy);}
  .appeal-card .tx .s{font-size:8.5px;color:var(--ink-soft);margin-top:1px;}
  .appeal-card .go{font-size:9.5px;font-weight:700;color:var(--coral-dark);flex-shrink:0;}

  .award-row{display:flex;align-items:center;gap:8px;padding-top:8px;margin-top:8px;border-top:1px solid var(--line);}
  .award-row .ic{width:24px;height:24px;border-radius:7px;background:#faf1de;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .award-row .t{font-size:10px;color:var(--ink);}

  .ev-mini-row{display:flex;gap:8px;}
  .ev-mini{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0;}
  .ev-mini .d{font-family:'Manrope',sans-serif;font-weight:800;color:var(--coral-dark);font-size:13px;}
  .ev-mini .t{font-size:9px;font-weight:700;margin-top:3px;line-height:1.25;color:var(--ink);}
  .ev-mini .l{font-size:8px;color:var(--ink-soft);margin-top:3px;}

  .kpark-mini{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    border-radius:14px;padding:9px 12px;color:#fff;}
  .kpark-mini .ring{width:34px;height:34px;flex-shrink:0;}
  .kpark-mini .ring .in{width:26px;height:26px;font-size:8px;}
  .kpark-mini .tx{flex:1;}
  .kpark-mini .tx .t{font-family:'Manrope',sans-serif;font-weight:800;font-size:10.5px;}
  .kpark-mini .tx .s{font-size:8.5px;color:#c9d8ea;margin-top:1px;}

  /* EVENTS screen */
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:10px;}
  .seg div{flex:1;text-align:center;font-size:11px;font-weight:700;padding:7px 0;border-radius:8px;color:var(--ink-soft);}
  .seg div.on{background:var(--navy);color:#fff;}
  .filters{display:flex;gap:6px;margin-bottom:10px;overflow:hidden;}
  .event-card{margin-bottom:10px;}
  .event-card .row{display:flex;gap:10px;}
  .date-badge{width:44px;height:48px;border-radius:10px;background:var(--cream);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
  .date-badge .d{font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;color:var(--coral-dark);line-height:1;}
  .date-badge .m{font-size:8.5px;color:var(--ink-soft);text-transform:uppercase;}
  .ev-title{font-size:12px;font-weight:700;}
  .ev-loc{font-size:10px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:4px;}
  .avatars{display:flex;margin-top:8px;}
  .avatars i{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#e9d9c4,#f4c9a8);border:2px solid #fff;margin-left:-6px;}
  .avatars i:first-child{margin-left:0;}
  .mini-btn{margin-top:9px;align-self:flex-start;}

  /* DIRECTIONS screen */
  .dir-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .dir-card{padding:8px;}
  .dir-ic{width:32px;height:32px;border-radius:9px;background:var(--cream);display:flex;align-items:center;justify-content:center;margin-bottom:6px;flex-shrink:0;}
  .dir-ic img{display:block;}
  .dir-ic.wide{width:56px;}
  .dir-card .n{font-size:11px;font-weight:700;line-height:1.25;}
  .dir-card .c{font-size:9px;color:var(--ink-soft);margin-top:3px;}
  .search-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 12px;margin-bottom:8px;}
  .search-bar span{font-size:11px;color:var(--ink-soft);}

  /* PROFILE screen */
  .profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 14px;}
  .avatar-lg{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#e9d9c4,#f4c9a8);border:3px solid #fff;box-shadow:0 2px 8px rgba(15,42,74,.12);margin-bottom:8px;}
  .profile-head .nm{font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;color:var(--navy);}
  .profile-head .pos{font-size:10.5px;color:var(--coral-dark);font-weight:700;margin-top:2px;}
  .id-card{background:linear-gradient(135deg,var(--navy),var(--navy-2));border-radius:14px;padding:12px;color:#fff;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .id-card .l div:first-child{font-size:9px;color:#cfe0ee;}
  .id-card .l div:last-child{font-family:'Manrope',sans-serif;font-weight:700;font-size:12px;margin-top:2px;}
  .qr{width:40px;height:40px;border-radius:8px;background:#fff;
      background-image: repeating-linear-gradient(0deg,#0f2a4a 0 3px, transparent 3px 6px), repeating-linear-gradient(90deg,#0f2a4a 0 3px, transparent 3px 6px);
      background-blend-mode:multiply; }
  .org-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
  .org-node{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;font-size:9.5px;font-weight:700;color:var(--navy);line-height:1.25;}
  .org-node.on{border-color:var(--coral);background:#fef6f3;color:var(--coral-dark);}
  .roster-item{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);}
  .roster-item:last-child{border-bottom:none;}
  .roster-ph{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:repeating-linear-gradient(45deg,#ece3d6,#ece3d6 4px,#f6f0e6 4px,#f6f0e6 8px);}
  .roster-item .t{font-size:11px;font-weight:700;color:var(--ink-soft);font-style:italic;}
  .roster-item .s{font-size:9px;color:var(--ink-soft);margin-top:1px;}
  .list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .list-item .l{display:flex;align-items:center;gap:10px;}
  .list-ic{width:30px;height:30px;border-radius:9px;background:var(--cream);display:flex;align-items:center;justify-content:center;}
  .list-item .t{font-size:11.5px;font-weight:700;}
  .list-item .s{font-size:9.5px;color:var(--ink-soft);}

  .toptabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:10px;}
  .toptabs div{font-size:11.5px;font-weight:700;color:var(--ink-soft);padding-bottom:8px;}
  .toptabs div.on{color:var(--navy);border-bottom:2px solid var(--coral);}

  .logo-ph{width:32px;height:32px;border-radius:9px;flex-shrink:0;background:repeating-linear-gradient(45deg,#ece3d6,#ece3d6 4px,#f6f0e6 4px,#f6f0e6 8px);}

  .leader-card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;}
  .leader-card .roster-ph{width:44px;height:44px;}
  .leader-card .t{font-size:12px;font-weight:700;color:var(--navy);}
  .leader-card .s{font-size:9.5px;color:var(--ink-soft);margin-top:2px;}

  .info-row{display:flex;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);}
  .info-row:last-child{border-bottom:none;}
  .info-row .ic{width:26px;height:26px;border-radius:8px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .info-row .tx .t{font-size:9px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;}
  .info-row .tx .s{font-size:11px;color:var(--ink);margin-top:2px;line-height:1.4;}

  .icon-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .icon-tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;}
  .icon-tile .ic{width:26px;height:26px;border-radius:8px;background:var(--cream);display:flex;align-items:center;justify-content:center;margin:0 auto 5px;}
  .icon-tile .n{font-size:8px;font-weight:700;color:var(--ink);line-height:1.2;}

  .zone-list div{font-size:10px;color:var(--ink);padding:5px 2px;border-bottom:1px solid var(--line);}
  .zone-list div:last-child{border-bottom:none;}

  .build-carousel{display:flex;gap:8px;overflow:hidden;}
  .build-card{width:92px;flex-shrink:0;}
  .build-card .ph{height:62px;border-radius:12px;position:relative;background:linear-gradient(135deg,#2a4a6e,#3f7a9e);}
  .build-card .ph .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .build-card .play i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;}
  .build-card .cap{font-size:8.5px;color:var(--ink-soft);margin-top:5px;text-align:center;}
  .map-card{height:72px;border-radius:14px;background:linear-gradient(160deg,#eef2ec,#e4ece6);border:1px solid var(--line);position:relative;}
  .map-card .lbl{position:absolute;left:10px;bottom:8px;background:#fff;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:700;color:var(--navy);}
  .stat-row{display:flex;gap:8px;}
  .stat{flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px;}
  .stat b{display:block;font-family:'Manrope',sans-serif;font-size:14px;color:var(--navy);}
  .stat span{font-size:8.5px;color:var(--ink-soft);}

  .discount-card{text-align:center;padding:14px 8px;}
  .discount-card .pct{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;color:var(--coral-dark);}
  .discount-card .n{font-size:9.5px;font-weight:700;margin-top:4px;}

  .issue-card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;}
  .issue-card .cov{width:34px;height:46px;border-radius:5px;flex-shrink:0;background:linear-gradient(135deg,#0f2a4a,#173a5e);}
  .issue-card .tx{flex:1;}
  .issue-card .tx .t{font-size:11px;font-weight:700;color:var(--navy);}
  .issue-card .tx .s{font-size:9px;color:var(--ink-soft);margin-top:2px;}

  .show-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;}
  .show-row:last-child{border-bottom:none;}
  .show-row .ph{width:50px;height:64px;border-radius:10px;flex-shrink:0;}
  .show-row .tx{flex:1;min-width:0;}
  .show-row .tx .t{font-size:11.5px;font-weight:700;line-height:1.25;}
  .show-row .tx .s{font-size:9.5px;color:var(--ink-soft);margin-top:4px;}

  /* ---------- interactivity ---------- */
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}
  [data-goto],[data-tab-group]{cursor:pointer;user-select:none;transition:transform .12s ease, box-shadow .12s ease;}
  [data-goto]:active,[data-tab-group]:active{transform:scale(.97);}
  .card[data-goto]:hover,.dir-card:hover{box-shadow:0 4px 14px rgba(15,42,74,.14);}
  .tab:hover .icon{stroke:var(--coral-dark);}
  .icon-btn[data-goto]:hover{border-color:var(--coral);}

  /* ---------- filters button + badge ---------- */
  .filters-btn{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;position:relative;}
  .filters-btn span{font-size:10px;font-weight:700;color:var(--navy);}
  .filters-badge{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;border-radius:50%;background:var(--coral);color:#fff;font-size:8.5px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 2px;}

  /* ---------- filter overlay panel ---------- */
  .filter-overlay{position:absolute;inset:0;background:rgba(15,42,74,.42);z-index:20;}
  .filter-overlay .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + 8px);max-height:78%;overflow-y:auto;}
  .filter-overlay .fh{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:var(--navy);margin-bottom:10px;}
  .filter-overlay .fgroup-t{font-size:9.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;margin:10px 0 6px;}
  .filter-overlay label{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink);padding:4px 0;}
  .filter-overlay .frow{display:flex;gap:8px;}
  .filter-overlay .frow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:10.5px;font-family:inherit;}
  .filter-overlay .factions{display:flex;gap:8px;margin-top:14px;}
  .filter-overlay .factions button{flex:1;}

  /* ---------- bookmark button on event cards ---------- */
  .bookmark-btn{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:2;}
  .bookmark-btn svg{width:12px;height:12px;stroke:var(--navy);fill:none;stroke-width:2;}
  .bookmark-btn.bookmarked svg{fill:var(--coral);stroke:var(--coral);}
  .event-card .row{position:relative;}

  /* ---------- events calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cal-head .arrow{width:26px;height:26px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .cal-head .m{font-family:'Manrope',sans-serif;font-weight:800;font-size:12px;color:var(--navy);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:8.5px;color:var(--ink-soft);text-align:center;font-weight:700;padding-bottom:4px;}
  .cal-cell{position:relative;height:32px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink);}
  .cal-cell.empty{background:transparent;border:none;}
  .cal-cell.has-events{border-color:var(--coral);color:var(--navy);font-weight:700;}
  .cal-cell.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .cal-count{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--coral);color:#fff;font-size:7.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .cal-day-events{margin-top:12px;display:none;}
  .cal-day-events.active{display:block;}

  /* ---------- announcement list rows ---------- */
  .announce-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;}
  .announce-row:last-child{border-bottom:none;}
  .announce-row .ph{width:56px;height:56px;border-radius:10px;flex-shrink:0;}
  .announce-row .tx{flex:1;min-width:0;}
  .announce-row .tx .n{font-size:11.5px;font-weight:700;line-height:1.3;}
  .announce-row .tx .price{font-family:'Manrope',sans-serif;font-weight:800;font-size:10.5px;color:var(--coral-dark);margin-top:3px;}
  .announce-row .tx .c{font-size:9.5px;color:var(--ink-soft);}

  /* ---------- MDK opportunities / rating / achievements ---------- */
  .opp-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:10px;}
  .opp-card .t{font-size:12px;font-weight:700;color:var(--navy);}
  .opp-card .s{font-size:10px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}
  .opp-card .deadline{font-size:9px;color:var(--coral-dark);font-weight:700;margin-top:6px;}
  .opp-card button{margin-top:9px;width:100%;}
  .rating-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);}
  .rating-row:last-child{border-bottom:none;}
  .rating-row.me{background:#fef6f3;border-radius:10px;padding:8px;margin:2px 0;border-bottom:none;}
  .rating-row .place{width:22px;text-align:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:12px;color:var(--navy);flex-shrink:0;}
  .rating-row .tx{flex:1;}
  .rating-row .tx .t{font-size:11px;font-weight:700;}
  .rating-row .tx .s{font-size:9px;color:var(--ink-soft);}
  .badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .badge-tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;}
  .badge-tile.locked{opacity:.4;}
  .badge-tile .ic{width:34px;height:34px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}
  .badge-tile .n{font-size:8.5px;font-weight:700;line-height:1.25;}
  .badge-tile .d{font-size:7.5px;color:var(--ink-soft);margin-top:2px;}

  /* ---------- event detail state (free / paid / info) ---------- */
  [data-event-type="free"] .buy-ticket-block{display:none;}
  [data-event-type="paid"] .register-btn{display:none;}
  [data-event-type="info"] .register-btn,[data-event-type="info"] .buy-ticket-block{display:none;}

  /* ---------- v4 universal interactive layer ---------- */
  .ui-overlay{position:absolute;inset:0;background:rgba(15,42,74,.48);z-index:120;display:flex;align-items:flex-end;padding:0;}
  .ui-sheet{width:100%;max-height:82%;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 15px 18px;box-shadow:0 -10px 32px rgba(15,42,74,.18);}
  .ui-sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
  .ui-sheet-head b{font-family:'Manrope',sans-serif;font-size:14px;color:var(--navy);}
  .ui-sheet-head span{display:block;font-size:9px;color:var(--ink-soft);margin-top:2px;line-height:1.35;}
  .ui-close{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:18px;line-height:1;}
  .ui-field{margin-bottom:9px;}
  .ui-field label{display:block;font-size:8.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
  .ui-field input,.ui-field textarea,.ui-field select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 10px;font:10px 'Noto Sans',Arial,sans-serif;color:var(--ink);outline:none;}
  .ui-field textarea{min-height:68px;resize:vertical;}
  .ui-actions{display:flex;gap:7px;margin-top:12px;}
  .ui-actions button{flex:1;min-height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:'Manrope',sans-serif;font-size:9.5px;font-weight:800;color:var(--navy);}
  .ui-actions button.primary{background:var(--coral);border-color:var(--coral);color:#fff;}
  .ui-check{display:flex;align-items:flex-start;gap:7px;background:var(--cream);border-radius:10px;padding:9px;margin:7px 0;font-size:9px;line-height:1.4;}
  .ui-result{background:#f3f8f4;border:1px solid #d8e9dc;border-radius:12px;padding:10px;font-size:9px;line-height:1.45;color:#315f40;}
  .ui-list{display:flex;flex-direction:column;gap:7px;}
  .ui-list-item{border:1px solid var(--line);border-radius:11px;padding:9px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
  .ui-list-item b{font-size:9.5px;color:var(--navy);display:block}.ui-list-item span{font-size:8px;color:var(--ink-soft)}
  [data-action],button,.icon-btn,.chip{cursor:pointer;user-select:none;}
  button:disabled{opacity:.65;cursor:default;}
  .chip.on[data-action]{background:var(--navy);color:#fff;border-color:var(--navy);}

/* ============================================================
   MOBILE / TOUCH COMPATIBILITY PATCH — v10
   Keeps the desktop phone mockup, but becomes a real full-screen
   application on phones and small tablets.
   ============================================================ */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
button,input,select,textarea{font-family:inherit;}
button,a,[data-goto],[data-action],[data-tab-group],[data-toast],[data-period-filter],[data-donate-amount]{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.screen-body.scroll{
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
}
.tabbar{flex-shrink:0;}

@supports (height: 100dvh){
  @media (max-width:700px){.stage{height:100dvh;}}
}

@media (max-width:700px), (pointer:coarse) and (max-width:900px){
  html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--cream);
  }
  body{position:fixed;inset:0;}
  header.demo-header{display:none!important;}
  .stage{
    width:100%;
    height:100vh;
    padding:0;
    margin:0;
    display:block;
  }
  .phone{
    width:100%;
    max-width:none;
    height:100%;
    padding:0;
    margin:0;
    background:transparent;
    border-radius:0;
    box-shadow:none;
  }
  .screen{
    width:100%;
    height:100%;
    min-height:0;
    border-radius:0;
    overflow:hidden;
  }
  /* The real phone already has its own status bar / notch. */
  .screen>.notch,.screen>.status{display:none!important;}
  .screen-body{
    min-height:0;
    padding-left:14px;
    padding-right:14px;
    padding-top:max(10px, env(safe-area-inset-top));
  }
  .screen-body.scroll{
    overflow-y:auto!important;
    overflow-x:hidden;
  }
  .tabbar{
    width:100%;
    padding-top:7px;
    padding-left:max(4px, env(safe-area-inset-left));
    padding-right:max(4px, env(safe-area-inset-right));
    padding-bottom:calc(7px + env(safe-area-inset-bottom));
  }
  .v3-tabbar .tab,.tabbar .tab{
    flex:1 1 0;
    width:auto;
    min-width:0;
    min-height:48px;
    justify-content:center;
  }
  .tabbar .tab .icon{width:19px;height:19px;}
  .tabbar .tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icon-btn{
    width:40px;
    height:40px;
    min-width:40px;
    min-height:40px;
  }
  .soft-btn,.btn,.primary-wide,.external-btn,.source-pill{
    min-height:38px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  button{cursor:pointer;}
  input,select,textarea{font-size:16px!important;} /* prevents iOS zoom on focus */
  .filter-scroll,.opp-tabs,.filters,.brand-tabs{
    overflow-x:auto!important;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .filter-scroll::-webkit-scrollbar,.opp-tabs::-webkit-scrollbar,.filters::-webkit-scrollbar,.brand-tabs::-webkit-scrollbar{display:none;}
  .ui-overlay{padding-bottom:env(safe-area-inset-bottom);}
  .ui-sheet{
    max-height:min(86vh,calc(100dvh - env(safe-area-inset-top) - 12px));
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
}

/* Slightly wider phones get a little more breathing room without changing content. */

<template id="tpl-gazeta-article-culture"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● 5G 100%</span></div><div class="screen-body scroll gazeta-reader internal-reader"><div class="appbar"><div style="display:flex;align-items:center;gap:7px;min-width:0"><div aria-label="Назад" class="icon-btn" data-goto="__back__" role="button" tabindex="0"><svg aria-hidden="true" class="ui-svg" viewBox="0 0 24 24"><path d="M15.5 5 8.5 12l7 7"></path></svg></div><div class="reader-logo"><img alt="Корё ильбо" class="reader-brand-img" src="./assets/e62d2a25e338a545.png" data-cms-src="attr-12"></div><div><div class="name" style="font-size:12px"><span data-cms-key="text-0">Корё ильбо</span></div><div class="app-sub"><span data-cms-key="text-1">Чтение внутри Digital AKK</span></div></div></div></div><h2 data-cms-block="block-1"><span data-cms-key="text-2">День корейской культуры — от истоков в будущее</span></h2><div class="article-source-photo-v11" data-cms-block="block-2"><img alt="Фото из публикации Корё ильбо" data-source-image="https://koreilbo.com/news/den-koreyskoy-kultury-ot-istokov-v-budushchee/"></div><div class="article-meta" data-cms-block="block-3"><span data-cms-key="text-3">20 августа 2026 · Корё ильбо</span></div><p class="article-lead" data-cms-block="block-4"><span data-cms-key="text-4">Алматинский День корейской культуры в 2026 году был построен как движение от традиции к современности — в преддверии 90-летия проживания корейцев в Казахстане.</span></p><p data-cms-block="block-5"><span data-cms-key="text-5">Подготовка к фестивалю началась в Алматинском корейском национальном центре за несколько месяцев. Творческие коллективы готовили новые номера, а организаторы выстроили программу вокруг идеи «от истоков в будущее». Концерт начинался с традиционных корейских выступлений и барабанов, а затем переходил к современным танцам и сольным номерам.</span></p><p data-cms-block="block-6"><span data-cms-key="text-6">Художественный руководитель АКНЦ Марина Жумашева рассказывала редакции, что одним из самых сложных элементов стала координация большого числа коллективов и партнёров. Финальная репетиция 14 августа дополнительно осложнилась отключением электричества: артистам пришлось работать с портативной колонкой и фонариками.</span></p><p data-cms-block="block-7"><span data-cms-key="text-7">На площадке MEGA CENTER ALMATY работали ярмарка корейских товаров, стрит-фуд и презентации южнокорейских медицинских организаций. К гостям обратились заместитель председателя АКК Александра Цхай, Генеральный консул Республики Корея в Алматы Ха Тэ Ук и председатель АКНЦ Андрей Шин. Кульминацией стала концертная программа с участием коллективов АКНЦ, Корейского театра и гостей из Республики Корея.</span></p><div class="article-source-note" data-cms-block="block-8"><span data-cms-key="text-8">Материал внутри Digital AKK — редакционный пересказ открытой публикации. Оригинал остаётся доступен как источник, чтобы не воспроизводить текст издания дословно.</span></div><div class="reader-actions" data-cms-block="block-9"><button class="btn ghost" data-toast="Материал сохранён"><span data-cms-key="text-9">Сохранить</span></button><button class="btn ghost" data-toast="Ссылка на материал готова к отправке"><span data-cms-key="text-10">Поделиться</span></button><a class="btn" href="https://koreilbo.com/news/den-koreyskoy-kultury-ot-istokov-v-budushchee/" rel="noopener" target="_blank" data-cms-href="attr-13"><span data-cms-key="text-11">Источник ↗</span></a></div></div><div class="tabbar v3-tabbar nav-v11"><div aria-label="Главная" class="tab" data-goto="home" role="button" tabindex="0"><svg aria-hidden="true" class="nav-svg" viewBox="0 0 24 24"><path d="M3.5 10.8 12 3.8l8.5 7v9.1a1.6 1.6 0 0 1-1.6 1.6H5.1a1.6 1.6 0 0 1-1.6-1.6z"></path><path d="M9 21v-6.2h6V21"></path></svg><span>Главная</span></div><div aria-label="Вместе" class="tab active" data-goto="connect" role="button" tabindex="0"><svg aria-hidden="true" class="nav-svg" viewBox="0 0 e-image="https://koreilbo.com/news/alla-kha-pochti-polzhizni-v-koreyskom-tantse/"></div><div class="article-meta" data-cms-block="block-3"><span data-cms-key="text-3">19 августа 2026 · Корё ильбо</span></div><p class="article-lead" data-cms-block="block-4"><span data-cms-key="text-4">История Аллы Ха соединяет две профессии — преподавание математики и многолетнюю работу с корейским традиционным танцем в Караганде.</span></p><p data-cms-block="block-5"><span data-cms-key="text-5">Алла Викторовна много лет работала учителем математики, но параллельно занималась хореографией. В 2026 году ей исполнилось 70 лет, и почти половину жизни она руководит танцевальной группой «Киппым» народного ансамбля «Мугунхва».</span></p><p data-cms-block="block-6"><span data-cms-key="text-6">Её путь начался со студенческого казахского ансамбля «Жаркын». В 1993 году Алле Ха предложили перейти в коллектив Карагандинского корейского культурного центра. В 1995–1999 годах центр направлял её на стажировки в Алматы, где она изучала традиционный корейский танец, самульнори и изготовление корейских костюмов.</span></p><p data-cms-block="block-7"><span data-cms-key="text-7">Сегодня Алла Ха — член Карагандинского филиала АКК и художественный руководитель «Киппым». За годы работы в коллективе сменилось несколько поколений танцоров. В подготовке старшей группы ей помогает ученица Вера Кан, прошедшая обучение в Южной Корее и Алматы. В работе с молодёжью Алла Викторовна уделяет внимание не только технике танца, но и дисциплине, корейскому этикету и базовым языковым навыкам.</span></p><div class="article-source-note" data-cms-block="block-8"><span data-cms-key="text-8">Материал внутри Digital AKK — редакционный пересказ открытой публикации. Оригинал остаётся доступен как источник, чтобы не воспроизводить текст издания дословно.</span></div><div class="reader-actions" data-cms-block="block-9"><button class="btn ghost" data-toast="Материал сохранён"><span data-cms-key="text-9">Сохранить</span></button><butto le="display:flex;align-items:center;gap:7px;min-width:0"><div aria-label="Назад" class="icon-btn" data-goto="__back__" role="button" tabindex="0"><svg aria-hidden="true" class="ui-svg" viewBox="0 0 24 24"><path d="M15.5 5 8.5 12l7 7"></path></svg></div><div class="reader-logo"><img alt="Корё ильбо" class="reader-brand-img" src="./assets/e62d2a25e338a545.png" data-cms-src="attr-12"></div><div><div class="name" style="font-size:12px"><span data-cms-key="text-0">Корё ильбо</span></div><div class="app-sub"><span data-cms-key="text-1">Чтение внутри Digital AKK</span></div></div></div></div><h2 data-cms-block="block-1"><span data-cms-key="text-2">Я, Наташа и белый ослик. История стихотворения Пэк Сока</span></h2><div class="article-source-photo-v11" data-cms-block="block-2"><img alt="Фото из публикации Корё ильбо" data-source-image="https://koreilbo.com/news/ya-natasha-i-belyy-oslik-istoriya-stikhotvoreniya-pek-soka/"></div><div class="article-meta" data-cms-block="block-3"><span data-cms-key="text-3">19 августа 2026 · Корё ильбо</span></div><p class="article-lead" data-cms-block="block-4"><span data-cms-key="text-4">Материал рассказывает о биографии корейского поэта Пэк Сока и реальной истории любви, с которой связывают одно из его самых известных стихотворений.</span></p><p data-cms-block="block-5"><span data-cms-key="text-5">Пэк Сок родился в 1912 году в провинции Северный Пхёнан. Его литературный дебют состоялся в 1930 году после победы рассказа «Мать и сын» в конкурсе газеты «Чосон Ильбо». Позже он работал в этой же газете и сформировал собственный стиль, в котором заметное место занимали региональная речь и фольклорные мотивы.</span></p><p data-cms-block="block-6"><span data-cms-key="text-6">Стихотворение «Я, Наташа и белый ослик» было опубликовано в 1938 году. В статье приводится версия переводчика Тараса Витковского о том, что за образом Наташи стояла реальная возлюбленная поэта. Пэк Сок знал русский язык и позднее занимался переводами русской литературы.</span></p><p data-cms-block="block-7"><span data-cms-key="text-7">Отдельная часть материала посвящена Ким Ён Хан, также известной как Ким Джая. Спустя десятилетия она написала воспоминания о Пэк Соке, поддержала создание литературной премии его имени и передала крупное имущество буддийскому ордену Чоге. Их история стала частью культурной памяти вокруг стихотворения — уже далеко за пределами биографии самого поэта.</span></p><div class="article-source-note" data-cms-block="block-8"><span data-cms-key="text-8">Материал внутри Digital AKK — редакционный пересказ открытой публикации. Оригинал остаётся доступен как источник, чтобы не воспроизводить текст издания дословно.</span></div><div class="reader-actions" data-cms-block="block-9"><button class="btn ghost" data-toast="Материал сохранён"><span data-cms-key="text-9">Сохранить</span></button><button class="btn ghost" data-toast="Ссылка на материал готова к отправке"><span data-cms-key="text-10">Поделиться</span></button><a class="btn" href="https://koreilbo.com/news/ya-natasha-i-belyy-oslik-istoriya-stikhotvoreniya-pek-soka/" rel="noopener" target="_blank" data-cms-href="attr-13"><span data-cms-key="text-11">Источник ↗</span></a></div></div><div class="tabbar v3-tabbar nav-v11"><div aria-label="Главная" class="tab" data-goto="home" role="button" tabindex="0"><svg aria-hidden="true" class="nav-svg" viewBox="0 0 24 24"><path d="M3.5 10.8 12 3.8l8.5 7v9.1a1.6 1.6 0 0 1-1.6 1.6H5.1a1.6 1.6 0 0 1-1.6-1.6z"></path><path d="M9 21v-6.2h6V21"></path></svg><span>Главная</span></div><div aria-label="Вместе" class="tab active" data-goto="connect" role="button" tabindex="0"><svg aria-hidden="true" class="nav-svg" viewBox="0 0 24 24"><rect height="6.5" rx="1.7" width="6.5" x="3.5" y="3.5"></rect><rect height="6.5" rx="1.7" width="6.5" x="14" y="3.5"></rect><rect height="6.5" rx="1.7" width="6.5" x="3.5" y="14"></rect><rect height="6.5" rx="1.7" width="6.5" x="14" y="14"></rect></svg><span>Вместе</span></div><div aria-label="Возможности" cla ey="text-4">Пятидневный форум в Гуми объединил 70 молодых участников и был посвящён идентичности, образованию, связям между молодыми корейцами и их будущим проектам.</span></p><p data-cms-block="block-5"><span data-cms-key="text-5">Форум прошёл с 4 по 8 августа в Республике Корея, а основной площадкой стал Университет Кёнун в городе Гуми. В программу вошли образовательные и дискуссионные сессии, командная работа, культурные мероприятия, поездки и неформальное общение.</span></p><p data-cms-block="block-6"><span data-cms-key="text-6">Организатором выступил Koryoin Global Network при поддержке Университета Кёнун, Агентства по делам зарубежных корейцев, Азиатского фонда развития, Института по культурному объединению и Media Saram. Одной из центральных тем стали история и идентичность молодых корейцев, живущих в разных странах и языковых средах.</span></p><p data-cms-block="block-7"><span data-cms-key="text-7">Авторы материала подчёркивают, что задача таких форумов — не только сохранить память о прошлом, но и создать сеть людей, которые смогут вместе учиться, запускать компании, общественные инициативы, культурные и технологические проекты. После пяти дней участники увезли с собой контакты, сертификаты и опыт совместной работы, а долгосрочный результат будет зависеть от того, какие связи и инициативы возникнут дальше.</span></p><div class="article-source-note" data-cms-block="block-8"><span data-cms-key="text-8">Материал внутри Digital AKK — редакционный пересказ открытой публикации. Оригинал остаётся доступен как источник, чтобы не воспроизводить текст издания дословно.</span></div><div class="reader-actions" data-cms-block="block-9"><button class="btn ghost" data-toast="Материал сохранён"><span data-cms-key="text-9">Сохранить</span></button><button class="btn ghost" data-toast="Ссылка на материал готова к отправке"><span data-cms-key="text-10">Поделиться</span></button><a class="btn" href="https://koreilbo.com/news/k-next-future-link-2026-gumi-obedinyaya-molodezh-sozd <div class="card detail-card" data-cms-block="block-2"><div class="sec-head" style="margin-top:0"><div class="t"><span data-cms-key="text-10">Чем занимаются участники</span></div></div><div class="detail-list-v13">
<div><span class="dot"><svg aria-hidden="true" class="ui-svg" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></svg></span><div><b><span data-cms-key="text-11">Организуют события</span></b><span><span data-cms-key="text-12">Помогают готовить молодёжные форумы, встречи, культурные и общественные проекты: от идеи и регистрации до координации площадки.</span></span></div></div>
<div><span class="dot"><svg aria-hidden="true" class="ui-svg" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></svg></span><div><b><span data-cms-key="text-13">Работают в медиа и коммуникациях</span></b><span><span data-cms-key="text-14">Создают контент, ведут социальные сети, снимают фото и видео, готовят дизайн и помогают рассказывать о проектах МДК.</span></span></div></div>
<div><span class="dot"><svg aria-hidden="true" class="ui-svg" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></svg></span><div><b><span data-cms-key="text-15">Развивают волонтёрство</span></b><span><span data-cms-key="text-16">Участвуют в социальных инициативах, помогают на крупных мероприятиях АКК и получают практический опыт командной работы.</span></span></div></div>
<div><span class="dot"><svg aria-hidden="true" class="ui-svg" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></svg></span><div><b><span data-cms-key="text-17">Запускают образовательные и творческие инициативы</span></b><span><span data-cms-key="text-18">Тренинги, встречи со спикерами, обмен опытом между регионами, творческие проекты и новые форматы для молодёжи.</span></span></div></div>
</div></div>
<div class="card detail-card" data-cms-block="block-3"><div class="sec-head" style="margin-top:0"><div class="t"><span data-cms-key="text-19">Что получает участник</span></div></div><p><span data-cms-key="text-20">Практику реальной проектной работы, знакомства с активной молодёжью из регионов, возможность пробовать разные роли, формировать портфолио проектов и участвовать в инициативах АКК и партнёров. Внутри команды можно начать с волонтёрской задачи, а затем перейти к собственной зоне ответственности.</span></p></div>
<div class="card detail-card" data-cms-block="block-4"><div class="sec-head" style="margin-top:0"><div class="t"><span data-cms-key="text-21">Как устроена команда</span></div></div><div class="opp-grid-v13"><div class="opp-fact-v13"><small><span data-cms-key="text-22">География</span></small><b><span data-cms-key="text-23">Республиканская и региональные команды</span></b></div><div class="opp-fact-v13"><small><span data-cms-key="text-24">Набор</span></small><b><span data-cms-key="text-25">Постоянный</span></b></div><div class="opp-fact-v13"><small><span data-cms-key="text-26">Формат</span></small><b><span data-cms-key="text-27">Проектная и волонтёрская работа</span></b></div><div class="opp-fact-v13"><small><span data-cms-key="text-28">Старт</span></small><b><span data-cms-key="text-29">Анкета → связь с командой → знакомство</span></b></div></div></div>
<div class="card detail-card" data-cms-block="block-5"><div class="sec-head" style="margin-top:0"><div class="t"><span data-cms-key="text-30">Кому подойдёт</span></div></div><p><span data-cms-key="text-31">Тем, кто хочет быть полезным, готов работать в команде и брать ответственность. Предыдущий опыт не обязателен: важнее мотивация, пунктуальность и готовность учиться в процессе.</span></p></div>

<script type="module" src="./assets/user-LAD5EIO2.js"></script>
<div class="install-modal" id="install-modal" role="dialog" aria-modal="true" aria-labelledby="install-modal-title">
  <div class="install-dialog">
    <h3 id="install-modal-title">Установка приложения</h3>
    <p id="install-modal-text"></p>
    <ol id="install-modal-steps"></ol>
    <button class="install-close" id="install-close" type="button">Понятно</button>
  </div>
</div>

<script>
/* ---------- PWA registration ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function (err) {
      console.error("Service worker registration failed:", err);
    });
  });
}

/* ---------- install button behavior ---------- */
(function(){
  var deferredPrompt = null;
  var isStandalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
  if (window.navigator.standalone === true) isStandalone = true;
  var panel = document.getElementById("install-panel");
  var modal = document.getElementById("install-modal");
  var androidBtn = document.getElementById("install-android");
  var iosBtn = document.getElementById("install-ios");
  var closeBtn = document.getElementById("install-close");

  if (isStandalone && panel) panel.style.display = "none";
  function showModal(title, body, list){
    document.getElementById("install-modal-title").textContent = title;
    document.getElementById("install-modal-text").textContent = body;
    var steps = document.getElementById("install-modal-steps");
    steps.innerHTML = "";
    (list || []).forEach(function(item){ var li=document.createElement("li"); li.textContent=item; steps.appendChild(li); });
    modal.classList.add("show");
  }
  function closeModal(){ modal.classList.remove("show"); }
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredPrompt = e;
  });
  window.addEventListener("appinstalled", function(){
    deferredPrompt = null;
    if (panel) panel.style.display = "none";
  });
  if (androidBtn) androidBtn.addEventListener("click", async function(){
    if (deferredPrompt) {
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch(e) {}
      deferredPrompt = null;
      return;
    }
    showModal("Установка на Android","Если Chrome не показывает системное окно установки, используйте меню браузера:",[
      "Откройте эту страницу в Google Chrome.",
      "Нажмите ⋮ в правом верхнем углу.",
      "Выберите «Установить приложение» или «Добавить на главный экран».",
      "Подтвердите установку."
    ]);
  });
  if (iosBtn) iosBtn.addEventListener("click", function(){
    showModal("Установка на iPhone","На iPhone установка web app выполняется через Safari:",[
      "Откройте эту страницу именно в Safari.",
      "Нажмите «Поделиться». ",
      "Выберите «На экран Домой».",
      "Нажмите «Добавить»."
    ]);
  });
  if (closeBtn) closeBtn.addEventListener("click", closeModal);
  if (modal) modal.addEventListener("click", function(e){ if(e.target===modal) closeModal(); });
})();
</script>
